html, body {

.slot-card {

.thumbnail-wrapper {

}

.thumbnail-inner {
  position: relative;
  width: 100%;
  aspect-ratio: 16 / 9;
  border-radius: 10px;
  overflow: hidden;
  background: #120205;
}

.thumbnail-img {
  width: 100%;
  height: 100%;
  object-fit: cover;

}

.thumbnail-badge {

  bottom: 8px;

  font-size: 10.5px;
  font-weight: 600;
  padding: 3px 8px;
  border-radius: 6px;
  display: flex;
  align-items: center;
  gap: 5px;
}

.status-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--accent-red);
  box-shadow: 0 0 6px var(--accent-red);
}

.status-dot.unlocked {
  background: var(--success-green);
  box-shadow: 0 0 6px var(--success-green);
}

.progress-container {
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.progress-header {
  display: flex;
  justify-content: space-between;
  font-size: 11px;
  font-weight: 700;
  color: #ff99ab;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

.step-bars {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 5px;
  width: 100%;
}

.step-bar {
  height: 5px;
  border-radius: 3px;
  background: rgba(255, 255, 255, 0.1);
  transition: all 0.3s ease;
}

.step-bar.completed {
  background: linear-gradient(90deg, #ff2a4d, #ff6b84);
  box-shadow: 0 0 8px rgba(255, 42, 77, 0.6);
}

.step-bar.all-done {
  background: linear-gradient(90deg, #059669, #10b981);
  box-shadow: 0 0 8px rgba(16, 185, 129, 0.6);
}

.watch-btn {
  width: 100%;
  background: linear-gradient(135deg, #ff2a4d, #b30024);
  border: 1px solid rgba(255, 153, 171, 0.45);
  color: #fff;
  font-weight: 800;
  font-size: 13.5px;
  padding: 12px 16px;
  border-radius: 12px;

  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  box-shadow: 0 6px 16px var(--accent-glow);
  transition: transform 0.2s ease, opacity 0.2s ease;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

.watch-btn:active:not(:disabled) {
  transform: scale(0.97);
}

.watch-btn.unlocked-link {
  background: linear-gradient(135deg, #059669, #10b981);
  border: 1px solid rgba(167, 243, 208, 0.5);
  color: #ffffff;
  cursor: pointer;
  box-shadow: 0 8px 20px rgba(16, 185, 129, 0.4);

.watch-btn.unlocked-link:active {

}

.footer-note {

  text-align: center;
  line-height: 1.45;
  margin-top: 4px;
}

#toast {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%) translateY(20px);
  background: #1a0409;
  border: 1px solid rgba(255, 42, 77, 0.6);
  color: #fff;
  padding: 11px 20px;
  border-radius: 50px;
  font-size: 13px;
  font-weight: 600;
  opacity: 0;
  pointer-events: none;
  transition: all 0.3s ease;
  z-index: 999;
  white-space: nowrap;
  box-shadow: 0 10px 25px rgba(0, 0, 0, 0.75);
}

#toast.on {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}

@keyframes pulseSuccess {
  0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.5); }
  70% { box-shadow: 0 0 0 10px rgba(16, 185, 129, 0); }
  100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
}

<script>
(function() {
  "use strict";

  // 3 slots x 5 Adsgram block IDs each
  var SLOTS_ADS = [
    ["int-58039", "58040", "int-58041", "57735", "60593"],
    ["int-60594", "60595", "60596", "int-60597", "60598"],
    ["slot3-block-1", "slot3-block-2", "slot3-block-3", "slot3-block-4", "slot3-block-5"]
  ];

  // Specific link for each slot after watching 5 ads
  var SLOT_LINKS = [
    "https://www.mediafire.com/file/16wwc38y0vkjy02/Xinkcy+freestyle+pack+????????????.zip/file&action=check", // Slot 1 link[cite: 1]
    "https://t.me/+up_18EEy_0oyNjVl", // Slot 2 link (replace with specific link)[cite: 1]
    "https://t.me/+up_18EEy_0oyNjVl"  // Slot 3 link (replace with specific link)[cite: 1]
  ];

  var totalSlots = 3;
  var maxAdsPerSlot = 5;
  var slotCounts = [0, 0, 0];
  var activePlayingSlot = null;

  var TG = window.Telegram && window.Telegram.WebApp;
  if (TG) {
    try {
      TG.ready();
      TG.expand();
      if (TG.setHeaderColor) TG.setHeaderColor("#070002");
      if (TG.setBackgroundColor) TG.setBackgroundColor("#070002");
    } catch (e) {}
  }

  function showToast(msg) {
    var t = document.getElementById("toast");
    t.textContent = msg;
    t.classList.add("on");
    clearTimeout(t._timer);
    t._timer = setTimeout(function() {
      t.classList.remove("on");
    }, 2600);
  }

  function openSpecificLink(url) {
    if (TG && TG.openTelegramLink && url.indexOf("t.me/") !== -1) {
      TG.openTelegramLink(url);
    } else if (TG && TG.openLink) {
      TG.openLink(url);
    } else {
      window.open(url, "_blank");
    }
  }

  function updateAllUI() {
    for (var s = 0; s < totalSlots; s++) {
      var count = slotCounts[s];
      var progCount = document.getElementById("prog-count-" + s);
      var badgeText = document.getElementById("badge-text-" + s);
      var dot = document.getElementById("dot-" + s);
      var watchBtn = document.getElementById("watch-btn-" + s);
      var btnIcon = document.getElementById("btn-icon-" + s);
      var btnText = document.getElementById("btn-text-" + s);

      progCount.textContent = count + " / " + maxAdsPerSlot + " Completed";

      for (var b = 1; b <= maxAdsPerSlot; b++) {
        var bar = document.getElementById("s" + s + "-bar-" + b);
        if (b <= count) {
          bar.classList.add("completed");
          if (count >= maxAdsPerSlot) {
            bar.classList.add("all-done");
          }
        } else {
          bar.classList.remove("completed", "all-done");
        }
      }

      if (count < maxAdsPerSlot) {
        watchBtn.classList.remove("unlocked-link");
        btnIcon.textContent = "▶";
        btnText.textContent = "Watch Ads (" + count + "/" + maxAdsPerSlot + ")";
      } else {
        watchBtn.classList.add("unlocked-link");
        btnIcon.textContent = "🔓";
        btnText.textContent = "Open Unlocked Link";
        dot.classList.add("unlocked");
        badgeText.textContent = "Link Unlocked";
      }
    }
  }

  window.handleSlotAction = function(slotIndex) {
    if (activePlayingSlot !== null) return;

    // If 5 ads already watched in this slot, open its specific link
    if (slotCounts[slotIndex] >= maxAdsPerSlot) {
      var targetUrl = SLOT_LINKS[slotIndex];
      showToast("Opening unlocked link...");
      setTimeout(function() {
        openSpecificLink(targetUrl);
      }, 350);
      return;
    }

    var currentAdIndex = slotCounts[slotIndex];
    var currentBlockId = SLOTS_ADS[slotIndex][currentAdIndex];
    var btnText = document.getElementById("btn-text-" + slotIndex);

    activePlayingSlot = slotIndex;
    btnText.textContent = "Loading Ad " + (currentAdIndex + 1) + "/5...";

    if (!window.Adsgram) {
      setTimeout(function() {
        slotCounts[slotIndex]++;
        activePlayingSlot = null;
        updateAllUI();
        if (slotCounts[slotIndex] >= maxAdsPerSlot) {
          if (TG && TG.HapticFeedback) TG.HapticFeedback.notificationOccurred("success");
          showToast("Slot " + (slotIndex + 1) + " link unlocked!");
        } else {
          showToast("Ad " + slotCounts[slotIndex] + "/5 watched! " + (maxAdsPerSlot - slotCounts[slotIndex]) + " remaining.");
        }
      }, 700);
      return;
    }

    try {
      var AdController = window.Adsgram.init({ blockId: currentBlockId });
      AdController.show()
        .then(function(result) {
          activePlayingSlot = null;
          if (result && result.done) {
            slotCounts[slotIndex]++;
            updateAllUI();
            if (slotCounts[slotIndex] >= maxAdsPerSlot) {
              if (TG && TG.HapticFeedback) TG.HapticFeedback.notificationOccurred("success");
              showToast("Slot " + (slotIndex + 1) + " link unlocked!");
            } else {
              showToast("Ad " + slotCounts[slotIndex] + "/5 watched! " + (maxAdsPerSlot - slotCounts[slotIndex]) + " remaining.");
            }
          } else {
            updateAllUI();
            showToast("ആഡ് മുഴുവനായി കണ്ടാൽ മാത്രമേ അടുത്തതിലേക്ക് പോവുകയുള്ളൂ.");
          }
        })
        .catch(function(err) {
          activePlayingSlot = null;
          updateAllUI();
          showToast("ആഡ് ലോഡ് ചെയ്യുന്നതിൽ തടസ്സം നേരിട്ടു. വീണ്ടും ശ്രമിക്കുക.");
        });
    } catch (e) {
      activePlayingSlot = null;
      updateAllUI();
      showToast("ആഡ് സിസ്റ്റം എറർ. വീണ്ടും ശ്രമിക്കുക.");
    }
  };

  updateAllUI();
})();
</script>
